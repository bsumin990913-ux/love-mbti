<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>오늘의 검사</title>
<meta name="description" content="일상 속 순간으로 알아보는 성격 유형과 연애 유형 검사" />

<!-- 배포 도메인이 정해지면 https://example.com 을 전부 실제 주소로 바꾼다 -->
<link rel="canonical" href="https://example.com/" />
<meta name="theme-color" content="#ff6f0f" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="오늘의 검사" />
<meta property="og:locale" content="ko_KR" />
<meta property="og:url" content="https://example.com/" />
<meta property="og:title" content="오늘의 검사 · 성격 유형과 연애 유형" />
<meta property="og:description" content="사소한 순간들로 나를 그려봐요. 동네 성격 검사 52문항, 연애 유형 검사 44문항." />
<meta property="og:image" content="https://example.com/og-home.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="오늘의 검사 — 성격 · 연애 유형 검사" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./home-styles.css" />
</head>
<body class="theme-home">
<div class="app">
  <main class="home">
    <header class="home__head">
      <h1 class="home__title">오늘의 검사</h1>
      <p class="home__sub">사소한 순간들로 나를 그려봐요.<br />둘 중 어느 쪽이 더 궁금하세요?</p>
    </header>

    <nav class="picks">
      <!-- 성격 검사 -->
      <a class="pick pick--mbti" href="./mbti.html">
        <div class="pick__art" aria-hidden="true">
          <span class="blob blob--a"></span>
          <span class="blob blob--b"></span>
        </div>
        <div class="pick__body">
          <span class="pick__badge">52문항 · 약 6분</span>
          <h2 class="pick__title">동네 성격 검사</h2>
          <p class="pick__desc">
            알람을 몇 개 맞추는지, 단톡방 알림을 어떻게 두는지.
            평소의 나를 4가지 축으로 봐요.
          </p>
          <span class="pick__meta" data-progress="dongne-mbti/v1" data-total="52"></span>
          <span class="pick__go">검사하러 가기</span>
        </div>
      </a>

      <!-- 연애 검사 -->
      <a class="pick pick--love" href="./love.html">
        <div class="pick__art" aria-hidden="true">
          <span class="blob blob--a"></span>
          <span class="blob blob--b"></span>
        </div>
        <div class="pick__body">
          <span class="pick__badge">44문항 · 약 5분</span>
          <h2 class="pick__title">연애 유형 검사</h2>
          <p class="pick__desc">
            연락 텀, 서운함을 꺼내는 타이밍, 기념일의 온도.
            애착이론을 바탕으로 만들었어요.
          </p>
          <span class="pick__meta" data-progress="dongne-love/v1" data-total="44"></span>
          <span class="pick__go">검사하러 가기</span>
        </div>
      </a>
    </nav>

    <p class="home__foot">
      두 검사 모두 재미로 보는 참고 자료예요. 심리 진단이 아니에요.
      검사 전에 적은 이름과 답변은 결과 정리용으로 저장돼요.
    </p>
  </main>
</div>

<script>
  /* 진행 중인 검사가 있으면 카드에 표시한다 (검사 화면과 같은 저장 키를 읽는다) */
  document.querySelectorAll('.pick__meta').forEach((node) => {
    const total = Number(node.dataset.total);
    let done = 0;
    try {
      const data = JSON.parse(localStorage.getItem(node.dataset.progress));
      if (data && Array.isArray(data.answers)) done = data.answers.filter(Boolean).length;
    } catch (_) { /* 저장값이 깨졌으면 그냥 처음부터 안내한다 */ }

    if (done === 0) return;
    node.classList.add('is-shown');
    node.textContent = done >= total
      ? '지난 결과가 저장돼 있어요'
      : `이어서 하기 · ${done}/${total}`;
  });
</script>
</body>
</html>
